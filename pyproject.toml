[project]
name = "underwrite-agent"
version = "0.1.0"
description = "AI Underwriting Assistant — Agentic Fraud Investigation MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.31",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "pymupdf>=1.24.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.55.0",
    "numpy>=2.1.0",
    "sentence-transformers>=3.3.0",
    "python-dotenv>=1.0.0",
    "PyJWT[crypto]>=2.13.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "starlette>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: API + Postgres",
    "e2e: full investigation pipeline",
]

[tool.ruff]
line-length = 100
target-version = "py311"
