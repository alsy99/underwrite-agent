name: Deploy demo UI to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "apps/demo-ui/**"
      - ".github/workflows/deploy-demo-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/demo-ui/package-lock.json

      - name: Compute UI password hash
        env:
          UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
        run: |
          if [ -z "$UI_PASSWORD" ]; then
            echo "::error::Set repository secret UI_PASSWORD (demo login password)"
            exit 1
          fi
          HASH=$(printf '%s' "$UI_PASSWORD" | sha256sum | awk '{print $1}')
          echo "VITE_UI_PASSWORD_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Build demo UI
        working-directory: apps/demo-ui
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          if [ -z "$VITE_API_URL" ] || [ -z "$VITE_API_KEY" ]; then
            echo "::error::Set secrets VITE_API_URL (ngrok https URL) and VITE_API_KEY"
            exit 1
          fi
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
