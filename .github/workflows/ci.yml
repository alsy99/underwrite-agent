name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps + pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          # Transitive LangGraph ecosystem pins (security fixes)
          pip install -U "langgraph-sdk>=0.3.15" "langgraph-checkpoint>=4.1.1" "langsmith>=0.8.18"

      - name: Python dependency audit
        run: |
          # PYSEC-2025-194: torch via sentence-transformers (large transitive bump)
          python -m pip_audit --ignore-vuln PYSEC-2025-194

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/demo-ui/package-lock.json

      - name: npm audit (demo-ui production deps, high+)
        working-directory: apps/demo-ui
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: node_modules,.venv,venv,.git

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: underwrite
          POSTGRES_PASSWORD: underwrite
          POSTGRES_DB: underwrite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U underwrite -d underwrite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (build)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check packages apps tests

      - name: Unit tests
        env:
          LLM_PROVIDER: heuristic
          OSINT_MODE: fixture
          API_KEY: dev-api-key-change-me
          AUTH_MODE: both
        run: |
          PYTHONPATH=. python -m pytest tests \
            -m "not integration and not e2e" -q --tb=short

      - name: Integration + e2e tests
        env:
          LLM_PROVIDER: heuristic
          OSINT_MODE: fixture
          SYNC_INVESTIGATION: "0"
          API_KEY: dev-api-key-change-me
          AUTH_MODE: both
          TEST_DATABASE_URL: postgresql+asyncpg://underwrite:underwrite@localhost:5432/underwrite_test
          DATABASE_URL: postgresql+asyncpg://underwrite:underwrite@localhost:5432/underwrite_test
          REDIS_URL: redis://localhost:6379
        run: |
          PYTHONPATH=. python -m pytest tests/integration tests/e2e -q --tb=short

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/demo-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + production build
        run: npm run build

      - name: Unit + integration tests (Vitest)
        run: npm test

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (skips if UI not running)
        run: npm run test:e2e

  ci-success:
    name: ci-success
    needs: [security, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo "security=${{ needs.security.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
